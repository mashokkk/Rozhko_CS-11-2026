<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forefathers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">

    <!-- ВЕРХНЯ СЕКЦІЯ: меню + заголовок -->
    <div class="hero__top">

      <header class="header">
        <nav class="menu">
          <a href="#">Work</a>
          <a href="#">Expertise</a>
          <a href="#">Short Stories</a>
          <a href="#">Goods</a>
        </nav>

        <a href="#" class="seal">
          <img src="logo.svg" alt="Forefathers seal">
        </a>

        <div class="header__right">
          <a href="#" class="btn">Start a project</a>
        </div>
      </header>

      <h1 class="title">Forefathers</h1>

      <p class="tagline">A pronounced web agency ★ Building for the modern demand</p>
    </div>

    <!-- НИЖНЯ СЕКЦІЯ: текст, стрілка, логотипи -->
    <div class="hero__bottom">

      <p class="about">
        We're Forefathers Group, an agency of fortuitous gentleman carving a path
        through the digital landscape with knowledge and determination.
      </p>

      <a href="#next" class="arrow" aria-label="Scroll down">
        <svg viewBox="0 0 200 200" width="120" height="120">
          <defs>
            <path id="circle" d="M100,100 m-75,0 a75,75 0 1,1 150,0 a75,75 0 1,1 -150,0"/>
          </defs>
          <text>
            <textPath href="#circle" startOffset="0">THE NEW DESIGN FRONTIER</textPath>
          </text>
          <path d="M100 85 V120 M88 108 L100 120 L112 108" fill="none" stroke="#fff" stroke-width="2"/>
        </svg>
      </a>

      <div class="logos">
        <!-- Постав сюди свою картинку з білими логотипами (друге фото) -->
        <img src="img/logos.png" alt="Forefathers Global Publications, established July 04th, 2011">
      </div>

    </div>

  </section>

</body>
</html>
